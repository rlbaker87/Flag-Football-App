<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Practice 3 Runner</title>
<style>
  :root{
    --turf:#2F5D3A;
    --turf-dark:#20402A;
    --chalk:#FAFAF7;
    --navy:#1B2A4A;
    --navy-soft:#5B6B85;
    --amber:#D98A1F;
    --amber-fill:#F3B95A;
    --amber-bg:#FCEEDA;
    --line:#E3E1D9;
    --white:#FFFFFF;
    --green-bg:#E7F0E3;
    --green-line:#6E9A63;
    --red:#B23B34;
    --red-bg:#F5E4E2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--chalk);color:var(--navy);}
  button{font-family:inherit;cursor:pointer;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--chalk);padding-bottom:24px;}

  .topbar{background:var(--turf);color:var(--white);padding:0.9rem 1rem 0.9rem;}
  .topbar h1{margin:0;font-size:17px;font-weight:700;}
  .topbar .sub{margin:2px 0 0;font-size:12px;color:#CFE0D3;}

  .start-btn{
    display:block;width:calc(100% - 24px);margin:12px auto 4px;
    background:var(--amber-fill);border:none;color:#5C3A08;
    font-size:16px;font-weight:700;padding:16px 0;border-radius:14px;
  }

  /* Sticky timer bar */
  .timerbar{position:sticky;top:0;z-index:25;background:var(--navy);color:var(--white);padding:10px 14px;}
  .timerbar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .timerbar-label{font-size:12px;color:#B9C3D6;font-weight:600;}
  .timerbar-name{font-size:15px;font-weight:700;margin-top:1px;}
  .timerbar-clock{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;}
  .timerbar-clock.over{color:#F0A39F;}
  .timerbar-row{display:flex;gap:6px;}
  .tb-btn{flex:1;padding:9px 0;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.1);color:var(--white);font-size:12.5px;font-weight:700;}
  .tb-btn.next{background:var(--amber-fill);border-color:var(--amber-fill);color:#5C3A08;flex:1.4;}
  .tb-btn.pause{background:rgba(255,255,255,0.16);}

  .content{padding:12px 12px 4px;}

  /* Block list */
  .block-card{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:9px;min-height:60px;
  }
  .block-card:active{background:var(--chalk);}
  .block-card.now{border-color:var(--amber);background:var(--amber-bg);}
  .block-card.done{opacity:0.6;}
  .block-num{width:32px;height:32px;border-radius:9px;background:var(--amber-bg);color:#8A5410;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .block-card.done .block-num{background:var(--green-bg);color:#2E5424;}
  .block-info{flex:1;min-width:0;}
  .block-label{font-weight:700;font-size:14.5px;margin:0 0 2px;}
  .block-time{font-size:11.5px;color:var(--navy-soft);margin:0;}
  .icon-chev{width:18px;height:18px;flex-shrink:0;color:var(--navy-soft);}

  /* Detail header */
  .detail-topbar{background:var(--turf);color:var(--white);padding:10px 12px;display:flex;align-items:center;gap:10px;}
  .icon-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);color:var(--white);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
  .icon-btn svg{width:20px;height:20px;}
  .detail-titles{flex:1;min-width:0;}
  .detail-titles .dname{font-size:17px;font-weight:700;margin:0;line-height:1.2;}
  .detail-titles .dtime{font-size:11.5px;color:#CFE0D3;margin:1px 0 0;}

  .diagram-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;}
  .steps-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .steps-card ul{margin:0;padding-left:18px;}
  .steps-card li{font-size:13.5px;line-height:1.5;margin-bottom:8px;color:var(--navy);}
  .steps-card li:last-child{margin-bottom:0;}
  .note-card{background:var(--amber-bg);border:1px solid #EAD2A3;border-radius:14px;padding:12px 14px;font-size:12.5px;color:#6B4A0E;line-height:1.5;}
  .note-label{font-weight:700;margin:0 0 3px;}

  .complete-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center;margin-bottom:10px;}
  .complete-card h2{margin:0 0 6px;font-size:17px;}
  .complete-card p{margin:0 0 14px;font-size:13px;color:var(--navy-soft);}
  .reset-btn{background:var(--white);border:1px solid var(--turf);color:var(--turf);font-size:13px;font-weight:700;padding:10px 18px;border-radius:9px;}

  svg .icon-cone{fill:var(--amber-fill);stroke:var(--amber);}
  svg .kid-circ{fill:var(--green-bg);stroke:var(--green-line);}
  svg .coach-circ{fill:var(--amber-bg);stroke:var(--amber);}
  svg .shark-circ{fill:var(--red-bg);stroke:var(--red);}
  svg .def-circ{fill:var(--red-bg);stroke:var(--red);}
  svg .lbl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--navy);}
  svg .lbl-sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--navy-soft);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  var ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
  var ICON_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

  function football(cx, cy, r){
    r = r || 10;
    return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+r+'" ry="'+(r*0.6)+'" fill="#6B4226" stroke="#4A2D19" stroke-width="0.5"/>' +
           '<line x1="'+(cx-r*0.5)+'" y1="'+cy+'" x2="'+(cx+r*0.5)+'" y2="'+cy+'" stroke="#F7F0E6" stroke-width="1"/>';
  }
  function cone(cx, cy){
    return '<polygon class="icon-cone" points="'+cx+','+(cy-14)+' '+(cx+11)+','+(cy+9)+' '+(cx-11)+','+(cy+9)+'" stroke-width="0.75"/>';
  }
  function kid(cx, cy, label){
    label = label || "K";
    return '<circle class="kid-circ" cx="'+cx+'" cy="'+cy+'" r="13" stroke-width="0.75"/>' +
           '<text class="lbl" x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700">'+label+'</text>';
  }
  function coach(cx, cy){
    var s = '<circle class="coach-circ" cx="'+cx+'" cy="'+cy+'" r="15" stroke-width="0.75"/>';
    s += '<path d="M'+(cx-7)+' '+(cy+3)+' Q'+(cx-7)+' '+(cy-6)+' '+cx+' '+(cy-6)+' Q'+(cx+7)+' '+(cy-6)+' '+(cx+7)+' '+(cy+3)+' Z" fill="var(--navy)"/>';
    s += '<ellipse cx="'+(cx+3)+'" cy="'+(cy+3)+'" rx="9" ry="2.5" fill="var(--navy)"/>';
    return s;
  }
  function shark(cx, cy){
    return '<circle class="shark-circ" cx="'+cx+'" cy="'+cy+'" r="13" stroke-width="0.75"/>' +
           '<text class="lbl" x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700">S</text>';
  }
  function defender(cx, cy, label){
    label = label || "D";
    return '<circle class="def-circ" cx="'+cx+'" cy="'+cy+'" r="13" stroke-width="0.75"/>' +
           '<text class="lbl" x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700">'+label+'</text>';
  }

  var SVG_WARMUP =
    '<svg width="100%" viewBox="0 0 320 400" role="img"><title>Cone agility path</title>' +
    '<polyline points="160,60 110,130 210,200 110,270 210,340" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="5 5"/>' +
    '<line x1="210" y1="340" x2="160" y2="376" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="5 5"/>' +
    kid(160,45,"K") +
    '<text class="lbl-sub" x="182" y="48" font-size="11">Start</text>' +
    cone(110,130) + cone(210,200) + cone(110,270) + cone(210,340) +
    '<text class="lbl" x="160" y="392" text-anchor="middle" font-size="12" font-weight="700">Finish</text>' +
    '</svg>';

  var SVG_CROSS0 =
    '<svg width="100%" viewBox="0 0 340 280" role="img"><title>0-yard quick cross - kid crosses in front of the QB</title>' +
    '<text class="lbl-sub" x="170" y="18" text-anchor="middle" font-size="10.5">0-yard cross - crosses right in front of the QB</text>' +
    kid(55,190,"K") +
    '<path d="M55 176 L55 150 L200 140" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowdown1)"/>' +
    '<text class="lbl-sub" x="80" y="168" text-anchor="start" font-size="9.5">1. one step up</text>' +
    '<text class="lbl-sub" x="145" y="128" text-anchor="middle" font-size="9.5">2. cut right, run across</text>' +
    coach(140,235) + football(140,148,8) +
    '<line x1="140" y1="221" x2="140" y2="158" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowcross2)"/>' +
    '<text class="lbl-sub" x="170" y="255" text-anchor="middle" font-size="10.5">QB throws underneath as the kid crosses in front</text>' +
    '</svg>';

  var SVG_CROSS =
    '<svg width="100%" viewBox="0 0 350 430" role="img"><title>Cross route, QB 5 yards back in shotgun, path runs outside the cones</title>' +
    '<text class="lbl-sub" x="175" y="18" text-anchor="middle" font-size="10.5">Cross route - 5 cones each, tighter vs wider spacing</text>' +

    '<line x1="55" y1="300" x2="118" y2="340" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2 3"/>' +
    '<path d="M67 286 L67 214 Q67 204 80 204 L118 200" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowcross1)"/>' +
    cone(55,270) + cone(55,240) + cone(55,210) + cone(88,210) + cone(118,210) +
    '<line x1="118" y1="326" x2="118" y2="219" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowcross2)"/>' +
    kid(55,300,"K") + coach(118,340) +
    '<text class="lbl" x="86" y="375" text-anchor="middle" font-size="11" font-weight="700">5-yard cross</text>' +

    '<line x1="225" y1="300" x2="312" y2="340" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2 3"/>' +
    '<path d="M247 286 L247 174 Q247 164 260 164 L312 160" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowcross1)"/>' +
    cone(235,260) + cone(235,220) + cone(235,180) + cone(272,180) + cone(312,180) +
    '<line x1="312" y1="326" x2="312" y2="189" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowcross2)"/>' +
    kid(235,300,"K") + coach(312,340) +
    '<text class="lbl" x="272" y="375" text-anchor="middle" font-size="11" font-weight="700">10-yard cross</text>' +

    '<text class="lbl-sub" x="175" y="396" text-anchor="middle" font-size="10.5">QB lines up 5 yards back (shotgun depth) on every rep</text>' +
    '<text class="lbl-sub" x="175" y="410" text-anchor="middle" font-size="10.5">Cones mark the inside of the cut - kid stays outside them</text>' +
    '</svg>';

  var SVG_BREAKDOWN =
    '<svg width="100%" viewBox="0 0 340 400" role="img"><title>Breakdown and touch, diamond plus two outer lateral cones</title>' +
    '<line x1="170" y1="50" x2="100" y2="175" stroke="#C8C5B8" stroke-width="1.5"/>' +
    '<line x1="100" y1="175" x2="170" y2="300" stroke="#C8C5B8" stroke-width="1.5"/>' +
    '<line x1="170" y1="50" x2="240" y2="175" stroke="#C8C5B8" stroke-width="1.5"/>' +
    '<line x1="240" y1="175" x2="170" y2="300" stroke="#C8C5B8" stroke-width="1.5"/>' +
    '<line x1="100" y1="175" x2="60" y2="175" stroke="#C8C5B8" stroke-width="1" stroke-dasharray="2 3"/>' +
    '<line x1="240" y1="175" x2="280" y2="175" stroke="#C8C5B8" stroke-width="1" stroke-dasharray="2 3"/>' +
    '<text class="lbl-sub" x="80" y="165" text-anchor="middle" font-size="10">~5 yd</text>' +
    '<text class="lbl-sub" x="260" y="165" text-anchor="middle" font-size="10">~5 yd</text>' +
    cone(170,50) + cone(170,300) + cone(100,175) + cone(240,175) + cone(60,175) + cone(280,175) +
    defender(170,85,"T") +
    '<text class="lbl-sub" x="170" y="106" text-anchor="middle" font-size="10">T = Tackler</text>' +
    kid(170,265,"R") +
    '<text class="lbl-sub" x="170" y="245" text-anchor="middle" font-size="10">R = Runner</text>' +
    '<path d="M170 98 Q140 140 105 172" fill="none" stroke="#B23B34" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowbreakdown1)"/>' +
    '<path d="M170 252 Q140 220 108 180" fill="none" stroke="#6E9A63" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowbreakdown2)"/>' +
    '<text class="lbl" x="145" y="200" text-anchor="middle" font-size="10.5" font-weight="700">this rep: runner picks</text>' +
    '<text class="lbl" x="145" y="214" text-anchor="middle" font-size="10.5" font-weight="700">the left cone gap</text>' +
    '<text class="lbl-sub" x="170" y="335" text-anchor="middle" font-size="10.5">Both close toward the middle of whichever side cone</text>' +
    '<text class="lbl-sub" x="170" y="349" text-anchor="middle" font-size="10.5">the runner picks - left or right, either side each rep</text>' +
    '</svg>';

  var SVG_DEFPOS =
    '<svg width="100%" viewBox="0 0 320 380" role="img"><title>Catching from a defensive position, path runs outside the diamond</title>' +
    '<line x1="160" y1="50" x2="90" y2="175" stroke="#C8C5B8" stroke-width="1.5"/>' +
    '<line x1="90" y1="175" x2="160" y2="300" stroke="#C8C5B8" stroke-width="1.5"/>' +
    '<line x1="160" y1="50" x2="230" y2="175" stroke="#C8C5B8" stroke-width="1.5"/>' +
    '<line x1="230" y1="175" x2="160" y2="300" stroke="#C8C5B8" stroke-width="1.5"/>' +
    cone(160,50) + cone(160,300) + cone(90,175) + cone(230,175) +
    kid(160,80,"K") +
    '<text class="lbl-sub" x="160" y="105" text-anchor="middle" font-size="10.5">kids line up here</text>' +
    coach(160,270,"C") + football(160,290,7) +
    '<text class="lbl-sub" x="160" y="313" text-anchor="middle" font-size="10.5">coach holds the ball, points a direction</text>' +

    '<path d="M148 90 Q60 150 65 210" fill="none" stroke="#5B6B85" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowdefpos1)"/>' +
    '<path d="M150 258 Q75 220 68 213" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowcross2)"/>' +
    football(60,213,7) +
    '<text class="lbl-sub" x="60" y="238" text-anchor="middle" font-size="10.5">catch happens</text>' +
    '<text class="lbl-sub" x="60" y="251" text-anchor="middle" font-size="10.5">outside the cone</text>' +

    '<text class="lbl" x="160" y="345" text-anchor="middle" font-size="11" font-weight="700">Progression</text>' +
    '<text class="lbl-sub" x="160" y="359" text-anchor="middle" font-size="10.5">Add a defender - one receiver, one defender, compete for the ball</text>' +
    '</svg>';

  var SVG_GO =
    '<svg width="100%" viewBox="0 0 320 380" role="img"><title>Go route</title>' +
    '<line x1="80" y1="300" x2="150" y2="300" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2 3"/>' +
    cone(80,240) + cone(80,170) + cone(80,100) +
    '<line x1="80" y1="286" x2="80" y2="90" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowdown1)"/>' +
    '<line x1="150" y1="286" x2="92" y2="96" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowcross2)"/>' +
    kid(80,300,"K") + coach(150,300) + football(92,96,8) +
    '<text class="lbl-sub" x="160" y="70" text-anchor="middle" font-size="10.5">catch just outside the last cone</text>' +
    '<text class="lbl-sub" x="160" y="340" text-anchor="middle" font-size="10.5">Straight throw, slightly diagonal toward the cone line</text>' +
    '<text class="lbl-sub" x="160" y="354" text-anchor="middle" font-size="10.5">No cut - full speed the whole way, catch in stride</text>' +
    '</svg>';

  function O(cx, cy, label){
    return '<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="#FFFFFF" stroke="#111" stroke-width="2"/>' +
           '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#111">'+label+'</text>';
  }

  var SVG_ROUTEREPS =
    '<svg width="100%" viewBox="0 0 380 400" role="img"><title>Route reps, no ball</title>' +
    '<text x="190" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Route reps - NO BALL</text>' +
    '<line x1="20" y1="320" x2="360" y2="320" stroke="#111" stroke-width="1.5"/>' +
    O(40,320,"O") + O(115,320,"O") + O(190,320,"C") + O(265,320,"O") + O(340,320,"O") +
    O(215,362,"QB") + O(260,362,"O") +
    '<line x1="40" y1="304" x2="40" y2="65" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowdown1)"/>' +
    '<text x="40" y="52" text-anchor="middle" font-size="10" fill="#111">Go</text>' +
    '<line x1="340" y1="304" x2="340" y2="65" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowdown1)"/>' +
    '<text x="340" y="52" text-anchor="middle" font-size="10" fill="#111">Go</text>' +
    '<path d="M115 304 L115 210 Q115 198 128 197 L175 190" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowdown1)"/>' +
    '<text x="150" y="176" text-anchor="middle" font-size="10" fill="#111">Cross 10-yd</text>' +
    '<path d="M265 304 L265 240 Q265 230 252 229 L205 224" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowdown1)"/>' +
    '<text x="250" y="252" text-anchor="middle" font-size="10" fill="#111">Cross 5-yd</text>' +
    '<path d="M258 348 Q252 305 258 282" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowdown1)"/>' +
    '<text x="300" y="272" text-anchor="middle" font-size="10" fill="#111">RB release</text>' +
    '<text x="190" y="386" text-anchor="middle" font-size="10" fill="#555">Coach calls cadence - routes run on cue, no snap yet</text>' +
    '</svg>';

  var SVG_QBREPS =
    '<svg width="100%" viewBox="0 0 320 240" role="img"><title>QB reps - snap, secure, set</title>' +
    '<text x="160" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#111">QB reps - snap, secure, set</text>' +
    '<line x1="40" y1="110" x2="280" y2="110" stroke="#111" stroke-width="1.5"/>' +
    O(160,110,"C") + O(160,160,"QB") +
    '<line x1="160" y1="124" x2="160" y2="146" stroke="#111" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrowdown1)"/>' +
    '<line x1="176" y1="160" x2="210" y2="150" stroke="#111" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#arrowdown1)"/>' +
    '<text x="215" y="147" text-anchor="start" font-size="9.5" fill="#111">eyes upfield</text>' +
    '<text x="160" y="200" text-anchor="middle" font-size="10" fill="#555">1. Catch the snap clean</text>' +
    '<text x="160" y="214" text-anchor="middle" font-size="10" fill="#555">2. Secure the ball at the chest</text>' +
    '<text x="160" y="228" text-anchor="middle" font-size="10" fill="#555">3. Set feet, eyes upfield - no throw yet</text>' +
    '</svg>';

  var SVG_HOTPURSUIT =
    '<svg width="100%" viewBox="0 0 260 420" role="img"><title>Hot Pursuit, vertical sprint toward finish</title>' +
    '<line x1="40" y1="50" x2="220" y2="50" stroke="var(--navy-soft)" stroke-width="1.5"/>' +
    '<text class="lbl-sub" x="130" y="35" text-anchor="middle" font-size="10.5">finish line</text>' +
    '<line x1="40" y1="380" x2="220" y2="380" stroke="#C8C5B8" stroke-width="1" stroke-dasharray="3 3"/>' +
    '<text class="lbl-sub" x="130" y="398" text-anchor="middle" font-size="10">start (both lying prone, facing up)</text>' +
    '<ellipse cx="130" cy="355" rx="11" ry="24" fill="#F5E4E2" stroke="#B23B34" stroke-width="1"/>' +
    '<polygon points="130,327 124,338 136,338" fill="#F5E4E2" stroke="#B23B34" stroke-width="1"/>' +
    '<text class="lbl" x="130" y="359" text-anchor="middle" font-size="9.5" font-weight="700">Chaser</text>' +
    '<ellipse cx="130" cy="270" rx="11" ry="24" fill="#E7F0E3" stroke="#6E9A63" stroke-width="1"/>' +
    '<polygon points="130,242 124,253 136,253" fill="#E7F0E3" stroke="#6E9A63" stroke-width="1"/>' +
    '<text class="lbl" x="130" y="274" text-anchor="middle" font-size="9.5" font-weight="700">Runner</text>' +
    '<line x1="130" y1="300" x2="130" y2="330" stroke="var(--navy-soft)" stroke-width="1" stroke-dasharray="2 3"/>' +
    '<text class="lbl-sub" x="150" y="318" text-anchor="start" font-size="10">2 yd gap</text>' +
    '<line x1="115" y1="325" x2="105" y2="70" stroke="#B23B34" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowbreakdown1)"/>' +
    '<line x1="145" y1="240" x2="150" y2="70" stroke="#6E9A63" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowbreakdown2)"/>' +
    '</svg>';

  var ARROW_DEFS =
    '<svg width="0" height="0" style="position:absolute">' +
    '<defs>' +
    '<marker id="arrowdown1" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L5 8L10 0" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowdown2" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L5 8L10 0" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowtouch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowsharks" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L5 8L10 0" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowcross1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowcross2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--amber)" stroke-width="1.5"/></marker>' +
    '<marker id="arrowbreakdown1" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L5 8L10 0" fill="none" stroke="#B23B34" stroke-width="1.5"/></marker>' +
    '<marker id="arrowbreakdown2" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L5 8L10 0" fill="none" stroke="#6E9A63" stroke-width="1.5"/></marker>' +
    '<marker id="arrowdefpos1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5B6B85" stroke-width="1.5"/></marker>' +
    '</defs></svg>';

  var BLOCKS = [
    {
      id:"warmup", label:"Warm-up", plannedTime:"6:00", duration:12, diagram:SVG_WARMUP,
      steps:[
        "High knees + butt kicks - down and back.",
        "Carioca (grapevine steps) + backpedal - down and back.",
        "Stance & start bursts - 2-point stance, explode on cue.",
        "Sprint-to-cut - straight sprint, plant and cut on whistle (primes the cross route).",
        "Backpedal into breakdown position - shuffle back, chop into stance (primes Breakdown & Touch).",
        "Cone zig-zag - one kid at a time weaves through the 5 cones."
      ],
      note:"Straight into warm-up at 6:00, no opening huddle - huddle moves to the end tonight. These drills double as reps for skills coming later in practice."
    },
    {
      id:"water1", label:"Water break", plannedTime:"6:12", duration:2, diagram:null,
      steps:["Let them drink and shake out before the cross routes."],
      note:null
    },
    {
      id:"crossroute", label:"Cross route family - 0/5/10-yd", plannedTime:"6:14", duration:10, diagram:SVG_CROSS0, diagram2:SVG_CROSS,
      diagramLabel1:"0-yard (quick underneath)", diagramLabel2:"5-yard and 10-yard",
      steps:[
        "Run all three depths in the same session: 0-yard (quick underneath), 5-yard, and 10-yard.",
        "0-yard: kid takes one step upfield, then cuts and runs across, right in front of the QB's line of sight. QB throws underneath as the kid crosses in front - not a stationary catch.",
        "5-yard and 10-yard: straight, then cut outside the cones. QB lines up 5 yards back in shotgun on every rep, including the 0-yard version.",
        "5 cones per lane for the 5/10-yard versions - tighter spacing for 5-yard, wider for 10-yard.",
        "Two groups, spread apart, same cut direction. Coaches sort kids into groups live based on who's ready for the longer one.",
        "Rotate through so everyone gets reps at all three depths over the season."
      ],
      note:"Use the route name every rep - \"run your cross\" - so it sticks before we add more routes."
    },
    {
      id:"goroute", label:"Go route", plannedTime:"6:24", duration:11, diagram:SVG_GO,
      steps:[
        "Straight sprint, no cut - full speed the whole way.",
        "QB throws a lead pass so the kid catches it over the shoulder without slowing down.",
        "Good contrast right after the cross: \"cross cuts, go doesn't.\""
      ],
      note:"Straight into this from the cross route - no break in between."
    },
    {
      id:"water2", label:"Water break", plannedTime:"6:35", duration:2, diagram:null,
      steps:["Quick reset before breakdown and touch."],
      note:null
    },
    {
      id:"breakdown", label:"Tackling / breaking down", plannedTime:"6:37", duration:8, diagram:SVG_BREAKDOWN,
      steps:[
        "Set a diamond: one cone top, one cone bottom, one cone left, one cone right. Add two more cones about 5 yards further out laterally from the left and right diamond cones.",
        "Tackler (T) starts at the top cone, runner (R) starts at the bottom cone with the ball.",
        "On go, both close toward the middle of whichever side cone the runner picks - left or right, either side each rep. Runner must stay inside the outer cones.",
        "Tackler's job: break down a few steps before contact - chop your feet, stay low, stay square - then get the two-hand touch.",
        "A rep ends when the tackler gets the touch, or the runner gets all the way through clean."
      ],
      note:"The breakdown position right before contact is the actual teaching point - call it out every rep: \"chop, stay low, stay square.\""
    },
    {
      id:"defpos", label:"Catching from a defensive position", plannedTime:"6:45", duration:13, diagram:SVG_DEFPOS,
      steps:[
        "Same diamond cone layout. Kids line up at the top cone, coach holds the ball at the bottom cone.",
        "Coach points a direction and floats the ball up - kid has to read the cue, close the distance, and catch it coming forward, not standing and waiting.",
        "Path runs to the outside of the diamond cones, not through the middle.",
        "This is the opposite skill from a route - reacting and attacking the ball instead of running a planned path.",
        "Progression: add a second kid as a defender. One receiver, one defender, both react to the point and compete for the catch."
      ],
      note:"Good for both sides of the ball - receivers learn to attack the ball, and it doubles as early defensive back training."
    },
    {
      id:"water3", label:"Water break", plannedTime:"6:58", duration:2, diagram:null,
      steps:["Quick reset before play install."],
      note:null
    },
    {
      id:"routereps", label:"Play Install - Route Reps (no ball)", plannedTime:"7:00", duration:8, diagram:SVG_ROUTEREPS,
      steps:[
        "Full formation lines up: 5 on the line (center + 4 receivers), QB and RB in the backfield.",
        "Coach calls a cadence - receivers run their assigned routes (Go outside, Cross 5/10 inside, RB releases on the 0-yard) with no ball thrown at all.",
        "Purpose: lock in spacing, timing off the snap count, and route depth before adding any ball-handling pressure.",
        "Rotate through a few reps so everyone gets multiple routes, not just their \"main\" one."
      ],
      note:"This is pure repetition - no new teaching here, just grooving what they already know under formation pressure."
    },
    {
      id:"qbreps", label:"Play Install - QB Reps", plannedTime:"7:08", duration:11, diagram:SVG_QBREPS,
      steps:[
        "Isolate the center-to-QB exchange: clean snap, QB hands ready, secure catch.",
        "Combine the snap with the QB's next step: catch it clean, secure the ball at the chest, get into a proper set position with eyes upfield.",
        "Still no throw today - that's next practice, once this feels automatic.",
        "Good rep count for the QB candidate specifically - watch this alongside what you saw from him in the Cross Route work."
      ],
      note:"Center is not an eligible receiver - snaps and blocks only, never a target. Worth a quick reminder here."
    },
    {
      id:"hotpursuit", label:"Hot Pursuit (cardio)", plannedTime:"7:19", duration:4, diagram:SVG_HOTPURSUIT,
      steps:[
        "Two kids, same direction, lying prone, 2 yards apart - chaser's feet at the start line, runner 2 yards ahead.",
        "Coach says \"go\" - both pop up and sprint straight toward the finish line.",
        "Runner is racing to reach the line; chaser is trying to tag them before they get there.",
        "Rotate pairs through quickly - short, explosive bursts, not a long run."
      ],
      note:"Next week: cut-off angle sprints as the follow-up to this."
    },
    {
      id:"cooldownstretch", label:"Cool-down stretch", plannedTime:"7:23", duration:4, diagram:null,
      steps:[
        "Light group stretch - keep it fun, call out silly names for each stretch."
      ],
      note:null
    },
    {
      id:"huddle", label:"Huddle / wrap-up", plannedTime:"7:27", duration:3, diagram:null,
      steps:[
        "Team cheer.",
        "Remind them what we named tonight - the cross route and the go route - and that we'll keep building on it.",
        "Next practice: same time, same place."
      ],
      note:"Ending on the vocabulary reinforces it one more time before they head home."
    }
  ];

  var view = "home";
  var viewBlockIndex = null;

  var practice = {
    running:false,
    complete:false,
    currentIndex:-1,
    currentBlockStart:null,
    paused:false,
    pausedAt:null,
    durations: BLOCKS.map(function(b){ return b.duration; }),
    actualStarts: []
  };

  var tickHandle = null;
  var audioCtx = null;

  function beep(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.value = 0.001;
      o.connect(g); g.connect(audioCtx.destination);
      var now = audioCtx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      o.start(now); o.stop(now + 0.55);
      var o2 = audioCtx.createOscillator();
      var g2 = audioCtx.createGain();
      o2.type = "sine"; o2.frequency.value = 1180;
      g2.gain.value = 0.001;
      o2.connect(g2); g2.connect(audioCtx.destination);
      g2.gain.exponentialRampToValueAtTime(0.22, now + 0.6);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 1.05);
      o2.start(now + 0.58); o2.stop(now + 1.1);
    }catch(e){}
  }

  function fmtClock(ts){
    var d = new Date(ts);
    var h = d.getHours();
    var m = d.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if(h === 0) h = 12;
    return h + ":" + (m < 10 ? "0" : "") + m + " " + ampm;
  }
  function fmtCountdown(ms){
    var neg = ms < 0;
    var abs = Math.abs(ms);
    var totalSec = Math.floor(abs / 1000);
    var mm = Math.floor(totalSec / 60);
    var ss = totalSec % 60;
    return (neg ? "-" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss;
  }

  function scheduledStart(i){
    if(!practice.running && practice.currentIndex === -1) return null;
    if(i < practice.currentIndex) return practice.actualStarts[i] || null;
    if(i === practice.currentIndex) return practice.currentBlockStart;
    var t = practice.currentBlockStart + practice.durations[practice.currentIndex] * 60000;
    for(var k = practice.currentIndex + 1; k < i; k++){
      t += practice.durations[k] * 60000;
    }
    return t;
  }

  function nowRef(){
    return practice.paused ? practice.pausedAt : Date.now();
  }

  function startPractice(){
    practice.running = true;
    practice.complete = false;
    practice.currentIndex = 0;
    practice.currentBlockStart = Date.now();
    practice.paused = false;
    practice.actualStarts = [Date.now()];
    practice.bellPlayedIndex = -1;
    startTicker();
    render();
  }

  function nextBlock(){
    if(practice.currentIndex < BLOCKS.length - 1){
      practice.currentIndex++;
      practice.currentBlockStart = Date.now();
      practice.actualStarts[practice.currentIndex] = Date.now();
      practice.paused = false;
      if(view === "block"){
        viewBlockIndex = practice.currentIndex;
        window.scrollTo(0,0);
      }
    } else {
      practice.running = false;
      practice.complete = true;
      stopTicker();
      if(view === "block"){
        goHome();
        return;
      }
    }
    render();
  }

  function addTime(min){
    practice.durations[practice.currentIndex] += min;
    render();
  }

  function togglePause(){
    if(practice.paused){
      var pausedDur = Date.now() - practice.pausedAt;
      practice.currentBlockStart += pausedDur;
      practice.paused = false;
    } else {
      practice.paused = true;
      practice.pausedAt = Date.now();
    }
    render();
  }

  function resetPractice(){
    practice = {
      running:false, complete:false, currentIndex:-1, currentBlockStart:null,
      paused:false, pausedAt:null,
      durations: BLOCKS.map(function(b){ return b.duration; }),
      actualStarts: [], bellPlayedIndex:-1
    };
    stopTicker();
    render();
  }

  function startTicker(){
    stopTicker();
    tickHandle = setInterval(function(){
      if(practice.running && !practice.paused){
        var remaining = practice.durations[practice.currentIndex] * 60000 - (Date.now() - practice.currentBlockStart);
        if(remaining <= 0 && practice.bellPlayedIndex !== practice.currentIndex){
          practice.bellPlayedIndex = practice.currentIndex;
          beep();
        }
      }
      render();
    }, 1000);
  }
  function stopTicker(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  function goHome(){ view = "home"; viewBlockIndex = null; render(); window.scrollTo(0,0); }
  function openBlockView(i){ view = "block"; viewBlockIndex = i; render(); window.scrollTo(0,0); }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }

  function renderTimerBar(){
    var idx = practice.currentIndex;
    var b = BLOCKS[idx];
    var remaining = practice.durations[idx] * 60000 - (nowRef() - practice.currentBlockStart);
    var isOver = remaining < 0;
    var nextLabel = idx < BLOCKS.length - 1 ? BLOCKS[idx+1].label : "Finish";
    var html = '<div class="timerbar">';
    html += '<div class="timerbar-top"><div><p class="timerbar-label">' + (practice.paused ? "PAUSED" : "NOW") + '</p><p class="timerbar-name">' + esc(b.label) + '</p></div>';
    html += '<div class="timerbar-clock' + (isOver ? " over" : "") + '">' + fmtCountdown(remaining) + '</div></div>';
    html += '<div class="timerbar-row">';
    html += '<button class="tb-btn" data-add="1">+1m</button>';
    html += '<button class="tb-btn" data-add="3">+3m</button>';
    html += '<button class="tb-btn" data-add="5">+5m</button>';
    html += '<button class="tb-btn pause" data-action="pause">' + (practice.paused ? "Resume" : "Pause") + '</button>';
    html += '<button class="tb-btn next" data-action="next">' + (idx === BLOCKS.length-1 ? "Finish" : "Next \u203a") + '</button>';
    html += '</div></div>';
    return html;
  }

  function render(){
    var html = "";

    html += '<div class="topbar"><h1>Practice 3</h1><p class="sub">Beech Springs Middle - Thu, Aug 13</p></div>';

    if(practice.running){
      html += renderTimerBar();
    }

    if(view === "home"){
      html += '<div class="content">';

      if(!practice.running && !practice.complete){
        html += '<button class="start-btn" data-action="start">Start practice</button>';
      }

      if(practice.complete){
        html += '<div class="complete-card"><h2>Practice complete</h2><p>Nice work out there. Reset when you\'re ready for next time.</p><button class="reset-btn" data-action="reset">Reset for next practice</button></div>';
      }

      BLOCKS.forEach(function(b, i){
        var isNow = practice.running && i === practice.currentIndex;
        var isDone = practice.currentIndex > i || (practice.complete && true);
        var cls = "block-card" + (isNow ? " now" : "") + (isDone && !isNow ? " done" : "");
        var timeLabel;
        if(practice.running || practice.complete){
          if(i < practice.currentIndex || practice.complete){
            timeLabel = practice.actualStarts[i] ? fmtClock(practice.actualStarts[i]) + " - done" : "done";
          } else if(isNow){
            timeLabel = "In progress";
          } else {
            timeLabel = "~" + fmtClock(scheduledStart(i)) + " (est.)";
          }
        } else {
          timeLabel = b.plannedTime + " - " + b.duration + " min";
        }
        html += '<button class="' + cls + '" data-open="' + i + '">';
        html += '<div class="block-num">' + (i+1) + '</div>';
        html += '<div class="block-info"><p class="block-label">' + esc(b.label) + '</p><p class="block-time">' + timeLabel + '</p></div>';
        html += '<span class="icon-chev">' + ICON_CHEV + '</span></button>';
      });
      html += '</div>';
    }

    if(view === "block" && viewBlockIndex != null){
      var b2 = BLOCKS[viewBlockIndex];
      html += '<div class="detail-topbar"><button class="icon-btn" data-nav="home">' + ICON_BACK + '</button>';
      html += '<div class="detail-titles"><p class="dname">' + esc(b2.label) + '</p><p class="dtime">' + esc(b2.plannedTime) + ' - ' + b2.duration + ' min</p></div></div>';
      html += '<div class="content">';
      html += '<div class="steps-card"><ul>';
      b2.steps.forEach(function(s){ html += '<li>' + esc(s) + '</li>'; });
      html += '</ul></div>';
      if(b2.diagram){
        html += '<p class="block-time" style="margin:0 0 6px 2px;font-weight:700;">' + (b2.diagramLabel1 || 'Diagram') + '</p>';
        html += '<div class="diagram-card">' + b2.diagram + '</div>';
      }
      if(b2.diagram2){
        html += '<p class="block-time" style="margin:14px 0 6px 2px;font-weight:700;">' + (b2.diagramLabel2 || 'Diagram (continued)') + '</p>';
        html += '<div class="diagram-card">' + b2.diagram2 + '</div>';
      }
      if(b2.note){
        html += '<div class="note-card"><p class="note-label">Coaching note</p><p>' + esc(b2.note) + '</p></div>';
      }
      html += '</div>';
    }

    document.getElementById("app").innerHTML = ARROW_DEFS + html;
    attachHandlers();
  }

  function attachHandlers(){
    var app = document.getElementById("app");
    var startBtn = app.querySelector('[data-action="start"]');
    if(startBtn) startBtn.addEventListener("click", startPractice);
    var resetBtn = app.querySelector('[data-action="reset"]');
    if(resetBtn) resetBtn.addEventListener("click", resetPractice);
    var nextBtn = app.querySelector('[data-action="next"]');
    if(nextBtn) nextBtn.addEventListener("click", nextBlock);
    var pauseBtn = app.querySelector('[data-action="pause"]');
    if(pauseBtn) pauseBtn.addEventListener("click", togglePause);
    app.querySelectorAll('[data-add]').forEach(function(el){
      el.addEventListener("click", function(){ addTime(parseInt(el.getAttribute("data-add"), 10)); });
    });
    app.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener("click", function(){ openBlockView(parseInt(el.getAttribute("data-open"), 10)); });
    });
    var navHome = app.querySelector('[data-nav="home"]');
    if(navHome) navHome.addEventListener("click", goHome);
  }

  render();
})();
</script>

</html>
