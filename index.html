<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Flag Football - Coach Baker</title>
<style>
  :root{
    --turf:#2F5D3A;
    --chalk:#FAFAF7;
    --navy:#1B2A4A;
    --navy-soft:#5B6B85;
    --amber:#D98A1F;
    --amber-fill:#F3B95A;
    --line:#E3E1D9;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--chalk);color:var(--navy);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .wrap{max-width:420px;width:100%;padding:24px;}
  .topbar{background:var(--turf);color:var(--white);padding:1.2rem 1.4rem;border-radius:16px 16px 0 0;text-align:center;}
  .topbar h1{margin:0;font-size:19px;font-weight:700;}
  .topbar p{margin:4px 0 0;font-size:12.5px;color:#CFE0D3;}
  .cards{background:var(--white);border:1px solid var(--line);border-top:none;border-radius:0 0 16px 16px;padding:20px;}
  a.app-btn{
    display:block;text-decoration:none;
    background:var(--chalk);border:1px solid var(--line);border-radius:14px;
    padding:18px 16px;margin-bottom:14px;color:var(--navy);
  }
  a.app-btn:last-child{margin-bottom:0;}
  a.app-btn:active{background:var(--amber-fill);}
  .app-title{font-size:16px;font-weight:700;margin:0 0 4px;}
  .app-desc{font-size:12.5px;color:var(--navy-soft);margin:0;line-height:1.4;}
  .app-icon{font-size:22px;margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Flag Football</h1>
    <p>Coach Baker &amp; Coach Ferguson</p>
  </div>
  <div class="cards">
    <a class="app-btn" href="Practice3_Runner_App.html">
      <div class="app-title">Practice 3 Runner</div>
      <p class="app-desc">Thu 8/13 &middot; 6:00&ndash;7:30 PM</p>
    </a>
    <a class="app-btn" href="Practice2_Runner_App.html">
      <div class="app-title">Practice 2 Runner</div>
      <p class="app-desc">Mon 8/10</p>
    </a>
    <a class="app-btn" href="Practice1_Runner_App.html">
      <div class="app-title">Practice 1 Runner</div>
      <p class="app-desc">Wed 8/6</p>
    </a>
    <a class="app-btn" href="Practice1_Evaluation_App.html">
      <div class="app-title">Player Evaluations</div>
      <p class="app-desc">Rate kids by drill during practice, add notes, and export a summary.</p>
    </a>
  </div>
</div>
</body>
</html>
