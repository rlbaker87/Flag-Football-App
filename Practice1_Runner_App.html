<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Practice 1 Runner</title>
<style>
  :root{
    --turf:#2F5D3A;
    --turf-dark:#20402A;
    --chalk:#FAFAF7;
    --navy:#1B2A4A;
    --navy-soft:#5B6B85;
    --amber:#D98A1F;
    --amber-fill:#F3B95A;
    --amber-bg:#FCEEDA;
    --line:#E3E1D9;
    --white:#FFFFFF;
    --green-bg:#E7F0E3;
    --green-line:#6E9A63;
    --red:#B23B34;
    --red-bg:#F5E4E2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--chalk);color:var(--navy);}
  button{font-family:inherit;cursor:pointer;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--chalk);padding-bottom:24px;}

  .topbar{background:var(--turf);color:var(--white);padding:0.9rem 1rem 0.9rem;}
  .topbar h1{margin:0;font-size:17px;font-weight:700;}
  .topbar .sub{margin:2px 0 0;font-size:12px;color:#CFE0D3;}

  .start-btn{
    display:block;width:calc(100% - 24px);margin:12px auto 4px;
    background:var(--amber-fill);border:none;color:#5C3A08;
    font-size:16px;font-weight:700;padding:16px 0;border-radius:14px;
  }

  /* Sticky timer bar */
  .timerbar{position:sticky;top:0;z-index:25;background:var(--navy);color:var(--white);padding:10px 14px;}
  .timerbar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .timerbar-label{font-size:12px;color:#B9C3D6;font-weight:600;}
  .timerbar-name{font-size:15px;font-weight:700;margin-top:1px;}
  .timerbar-clock{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;}
  .timerbar-clock.over{color:#F0A39F;}
  .timerbar-row{display:flex;gap:6px;}
  .tb-btn{flex:1;padding:9px 0;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.1);color:var(--white);font-size:12.5px;font-weight:700;}
  .tb-btn.next{background:var(--amber-fill);border-color:var(--amber-fill);color:#5C3A08;flex:1.4;}
  .tb-btn.pause{background:rgba(255,255,255,0.16);}

  .content{padding:12px 12px 4px;}

  /* Block list */
  .block-card{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:9px;min-height:60px;
  }
  .block-card:active{background:var(--chalk);}
  .block-card.now{border-color:var(--amber);background:var(--amber-bg);}
  .block-card.done{opacity:0.6;}
  .block-num{width:32px;height:32px;border-radius:9px;background:var(--amber-bg);color:#8A5410;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .block-card.done .block-num{background:var(--green-bg);color:#2E5424;}
  .block-info{flex:1;min-width:0;}
  .block-label{font-weight:700;font-size:14.5px;margin:0 0 2px;}
  .block-time{font-size:11.5px;color:var(--navy-soft);margin:0;}
  .icon-chev{width:18px;height:18px;flex-shrink:0;color:var(--navy-soft);}

  /* Detail header */
  .detail-topbar{background:var(--turf);color:var(--white);padding:10px 12px;display:flex;align-items:center;gap:10px;}
  .icon-btn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);color:var(--white);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
  .icon-btn svg{width:20px;height:20px;}
  .detail-titles{flex:1;min-width:0;}
  .detail-titles .dname{font-size:17px;font-weight:700;margin:0;line-height:1.2;}
  .detail-titles .dtime{font-size:11.5px;color:#CFE0D3;margin:1px 0 0;}

  .diagram-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;}
  .steps-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .steps-card ul{margin:0;padding-left:18px;}
  .steps-card li{font-size:13.5px;line-height:1.5;margin-bottom:8px;color:var(--navy);}
  .steps-card li:last-child{margin-bottom:0;}
  .note-card{background:var(--amber-bg);border:1px solid #EAD2A3;border-radius:14px;padding:12px 14px;font-size:12.5px;color:#6B4A0E;line-height:1.5;}
  .note-label{font-weight:700;margin:0 0 3px;}

  .complete-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center;margin-bottom:10px;}
  .complete-card h2{margin:0 0 6px;font-size:17px;}
  .complete-card p{margin:0 0 14px;font-size:13px;color:var(--navy-soft);}
  .reset-btn{background:var(--white);border:1px solid var(--turf);color:var(--turf);font-size:13px;font-weight:700;padding:10px 18px;border-radius:9px;}

  svg .icon-cone{fill:var(--amber-fill);stroke:var(--amber);}
  svg .kid-circ{fill:var(--green-bg);stroke:var(--green-line);}
  svg .coach-circ{fill:var(--amber-bg);stroke:var(--amber);}
  svg .shark-circ{fill:var(--red-bg);stroke:var(--red);}
  svg .lbl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--navy);}
  svg .lbl-sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--navy-soft);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  var ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
  var ICON_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

  function football(cx, cy, r){
    r = r || 10;
    return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+r+'" ry="'+(r*0.6)+'" fill="#6B4226" stroke="#4A2D19" stroke-width="0.5"/>' +
           '<line x1="'+(cx-r*0.5)+'" y1="'+cy+'" x2="'+(cx+r*0.5)+'" y2="'+cy+'" stroke="#F7F0E6" stroke-width="1"/>';
  }
  function cone(cx, cy){
    return '<polygon class="icon-cone" points="'+cx+','+(cy-14)+' '+(cx+11)+','+(cy+9)+' '+(cx-11)+','+(cy+9)+'" stroke-width="0.75"/>';
  }
  function kid(cx, cy, label){
    label = label || "K";
    return '<circle class="kid-circ" cx="'+cx+'" cy="'+cy+'" r="13" stroke-width="0.75"/>' +
           '<text class="lbl" x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700">'+label+'</text>';
  }
  function coach(cx, cy, label){
    return '<circle class="coach-circ" cx="'+cx+'" cy="'+cy+'" r="15" stroke-width="0.75"/>' +
           '<text class="lbl" x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="12" font-weight="700">'+label+'</text>';
  }
  function shark(cx, cy){
    return '<circle class="shark-circ" cx="'+cx+'" cy="'+cy+'" r="13" stroke-width="0.75"/>' +
           '<text class="lbl" x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700">S</text>';
  }

  var SVG_WARMUP =
    '<svg width="100%" viewBox="0 0 320 400" role="img"><title>Cone agility path</title>' +
    '<polyline points="160,60 110,130 210,200 110,270 210,340" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="5 5"/>' +
    '<line x1="210" y1="340" x2="160" y2="376" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="5 5"/>' +
    kid(160,45,"K") +
    '<text class="lbl-sub" x="182" y="48" font-size="11">Start</text>' +
    cone(110,130) + cone(210,200) + cone(110,270) + cone(210,340) +
    '<text class="lbl" x="160" y="392" text-anchor="middle" font-size="12" font-weight="700">Finish</text>' +
    '</svg>';

  var SVG_BALLSKILLS =
    '<svg width="100%" viewBox="0 0 320 320" role="img"><title>Two-line ball skills setup</title>' +
    coach(90,40,"B") + football(90,68,9) +
    coach(230,40,"F") + football(230,68,9) +
    '<line x1="90" y1="80" x2="90" y2="110" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowdown1)"/>' +
    '<line x1="230" y1="80" x2="230" y2="110" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowdown2)"/>' +
    kid(90,130,"1") + kid(90,170,"2") + kid(90,210,"3") + kid(90,250,"4") + kid(90,290,"5") +
    kid(230,130,"1") + kid(230,170,"2") + kid(230,210,"3") + kid(230,250,"4") + kid(230,290,"5") +
    '<text class="lbl-sub" x="160" y="200" text-anchor="middle" font-size="11">toss &amp;</text>' +
    '<text class="lbl-sub" x="160" y="214" text-anchor="middle" font-size="11">return,</text>' +
    '<text class="lbl-sub" x="160" y="228" text-anchor="middle" font-size="11">10-15 sec</text>' +
    '<text class="lbl-sub" x="160" y="242" text-anchor="middle" font-size="11">per kid</text>' +
    '</svg>';

  var SVG_TOUCH =
    '<svg width="100%" viewBox="0 0 320 170" role="img"><title>Two-hand touch mechanics</title>' +
    kid(80,85,"A") +
    kid(240,85,"B") +
    '<path d="M100 85 C 150 55, 190 55, 218 78" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowtouch)"/>' +
    '<circle cx="228" cy="92" r="7" fill="none" stroke="var(--amber)" stroke-width="1.5"/>' +
    '<text class="lbl-sub" x="160" y="30" text-anchor="middle" font-size="11">A reaches with two hands</text>' +
    '<text class="lbl-sub" x="160" y="150" text-anchor="middle" font-size="11">Hands go to the hip area, not a tackle</text>' +
    '</svg>';

  var SVG_SHARKS =
    '<svg width="100%" viewBox="0 0 320 380" role="img"><title>Sharks and Minnows with ball movement cue</title>' +
    '<text class="lbl-sub" x="150" y="42" text-anchor="middle" font-size="10.5">Ball starts at center,</text>' +
    '<text class="lbl-sub" x="150" y="56" text-anchor="middle" font-size="10.5">like a snap</text>' +
    '<rect x="30" y="70" width="260" height="240" fill="none" stroke="#C8C5B8" stroke-width="1"/>' +
    kid(60,88,"1") + kid(105,88,"2") + kid(195,88,"4") + kid(240,88,"5") +
    football(150,88,11) +
    '<text class="lbl-sub" x="270" y="92" text-anchor="start" font-size="10.5">minnows</text>' +
    coach(150,175,"F") +
    '<text class="lbl-sub" x="150" y="198" text-anchor="middle" font-size="10.5">F moves the ball to cue the run</text>' +
    shark(160,240) +
    '<text class="lbl-sub" x="160" y="265" text-anchor="middle" font-size="10.5">shark(s) in the middle</text>' +
    '<line x1="150" y1="105" x2="150" y2="150" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowsharks)"/>' +
    '<text class="lbl" x="160" y="350" text-anchor="middle" font-size="11" font-weight="700">Run only when the ball moves</text>' +
    '<text class="lbl-sub" x="160" y="366" text-anchor="middle" font-size="10.5">Move early = move back 5 yards</text>' +
    '</svg>';

  var SVG_BALLSKILLS_CROSS =
    '<svg width="100%" viewBox="0 0 350 410" role="img"><title>Two parallel L-shaped cone cut routes, coach throwing straight up to the last cone</title>' +
    '<text class="lbl-sub" x="175" y="18" text-anchor="middle" font-size="10.5">Two lines, spread apart, same cut direction</text>' +

    '<line x1="55" y1="300" x2="140" y2="300" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2 3"/>' +
    '<polyline points="55,286 55,180 140,175" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowcross1)"/>' +
    cone(55,260) + cone(55,220) + cone(55,180) + cone(95,178) + cone(140,175) +
    '<line x1="140" y1="286" x2="140" y2="192" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowcross2)"/>' +
    kid(55,300,"K") +
    coach(140,300,"B") +

    '<line x1="235" y1="300" x2="320" y2="300" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="2 3"/>' +
    '<polyline points="235,286 235,180 320,175" fill="none" stroke="#C8C5B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowcross1)"/>' +
    cone(235,260) + cone(235,220) + cone(235,180) + cone(275,178) + cone(320,175) +
    '<line x1="320" y1="286" x2="320" y2="192" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowcross2)"/>' +
    kid(235,300,"K") +
    coach(320,300,"F") +

    '<text class="lbl-sub" x="175" y="336" text-anchor="middle" font-size="10.5">Coach stands ~5 yards over, same starting line as the kid</text>' +
    '<text class="lbl-sub" x="175" y="350" text-anchor="middle" font-size="10.5">Kid runs straight up, then cuts right at the corner cone</text>' +
    '<text class="lbl-sub" x="175" y="364" text-anchor="middle" font-size="10.5">Coach throws straight up - the kid arrives at the last cone</text>' +
    '<text class="lbl" x="175" y="388" text-anchor="middle" font-size="11" font-weight="700">Reverse it</text>' +
    '<text class="lbl-sub" x="175" y="402" text-anchor="middle" font-size="10.5">After a few reps, run the same L cutting the other way</text>' +
    '</svg>';

  var ARROW_DEFS =
    '<svg width="0" height="0" style="position:absolute">' +
    '<defs>' +
    '<marker id="arrowdown1" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L5 8L10 0" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowdown2" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L5 8L10 0" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowtouch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowsharks" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L5 8L10 0" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowcross1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C8C5B8" stroke-width="1.5"/></marker>' +
    '<marker id="arrowcross2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--amber)" stroke-width="1.5"/></marker>' +
    '</defs></svg>';

  var BLOCKS = [
    {
      id:"huddle", label:"Welcome & huddle", plannedTime:"6:00", duration:5, diagram:null,
      steps:[
        "Gather the team in a circle. Introduce Coach Baker and Coach Ferguson.",
        "Set 2-3 simple expectations: listen, hustle, have fun.",
        "Quick show of hands: \"Who's played football before?\""
      ],
      note:"Keep talking to under a minute - this age group tunes out fast. Energy starts here."
    },
    {
      id:"warmup", label:"Warm-up", plannedTime:"6:05", duration:10, diagram:SVG_WARMUP,
      steps:[
        "High knees + butt kicks - down and back across a 10-yard stretch.",
        "Carioca (grapevine steps) + backpedal - down and back.",
        "Short sprint on whistle, 10-15 yards, one or two kids at a time.",
        "Cone zig-zag - one kid at a time weaves through the 5 cones."
      ],
      note:"Run this as one continuous line moving down the field - no standing around."
    },
    {
      id:"water1", label:"Water break", plannedTime:"6:15", duration:2, diagram:null,
      steps:["Let them drink and shake out before ball skills."],
      note:null
    },
    {
      id:"ballskills", label:"Ball skills - two drills", plannedTime:"6:17", duration:15, diagram:SVG_BALLSKILLS, diagram2:SVG_BALLSKILLS_CROSS,
      steps:[
        "Drill A - Two lines (first ~7 min): split into two lines of 5-6 kids. Coach Baker runs one line, Coach Ferguson runs the other.",
        "Each rep: coach tosses a soft, easy, chest-high pass to the kid at the front, kid catches, tosses it back, jogs to the back of the line.",
        "Aim for 10-15 seconds per kid so the line keeps moving.",
        "Drill B - Cone L-cut (remaining ~8 min): set 5 cones per line in an L shape - three straight, then two cutting across at a right angle.",
        "Coach stands about 5 yards to the side, on the same starting line as the kid - not up by the cones.",
        "Kid runs straight up the cones, then cuts right at the corner. Coach throws straight up, timed to arrive right as the kid reaches the last cone.",
        "Two lines, spread apart and running the same direction so kids don't collide - Coach Baker runs one line, Coach Ferguson runs the other, using all 10 cones.",
        "Rotate through - each kid gets 2-3 reps catching on the run.",
        "After a few rounds, reverse the drill so the cut goes the other direction."
      ],
      note:"Splitting into two drills keeps 15 minutes from feeling repetitive - same catching fundamentals, different look."
    },
    {
      id:"water2", label:"Water break", plannedTime:"6:32", duration:2, diagram:null,
      steps:["Quick reset before mechanics teaching."],
      note:null
    },
    {
      id:"touch", label:"Two-hand touch mechanics", plannedTime:"6:34", duration:5, diagram:SVG_TOUCH,
      steps:[
        "Quick demo: two hands go to the hips/belt area - not a tackle, not a shove.",
        "Pair up. One kid jogs slowly, partner practices reaching in with two hands.",
        "Switch roles.",
        "One quick reminder: \"Two hands, hips, no tackling.\""
      ],
      note:"This is genuinely simple at this age - show it once, let them try it twice."
    },
    {
      id:"sharks", label:"Sharks & Minnows", plannedTime:"6:39", duration:15, diagram:SVG_SHARKS,
      steps:[
        "Minnows line up on one end, shark(s) in the middle.",
        "Minnows can only run when Coach Ferguson moves the football.",
        "Move early (before the ball moves) = that kid moves back 5 yards.",
        "Coach Baker evaluates from the field - who reacts on time, who finds space."
      ],
      note:"Ferguson controls the ball-movement cue; Baker is free to observe."
    },
    {
      id:"cooldown", label:"Cool-down & wrap-up", plannedTime:"6:54", duration:5, diagram:null,
      steps:[
        "Light group stretch - keep it fun, call out silly names for each stretch.",
        "Team cheer.",
        "Remind them: next practice Thursday, same time, same place."
      ],
      note:"End on something positive - this sets the tone for whether they want to come back."
    }
  ];

  var view = "home";
  var viewBlockIndex = null;

  var practice = {
    running:false,
    complete:false,
    currentIndex:-1,
    currentBlockStart:null,
    paused:false,
    pausedAt:null,
    durations: BLOCKS.map(function(b){ return b.duration; }),
    actualStarts: []
  };

  var tickHandle = null;
  var audioCtx = null;

  function beep(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.value = 0.001;
      o.connect(g); g.connect(audioCtx.destination);
      var now = audioCtx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      o.start(now); o.stop(now + 0.55);
      var o2 = audioCtx.createOscillator();
      var g2 = audioCtx.createGain();
      o2.type = "sine"; o2.frequency.value = 1180;
      g2.gain.value = 0.001;
      o2.connect(g2); g2.connect(audioCtx.destination);
      g2.gain.exponentialRampToValueAtTime(0.22, now + 0.6);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 1.05);
      o2.start(now + 0.58); o2.stop(now + 1.1);
    }catch(e){}
  }

  function fmtClock(ts){
    var d = new Date(ts);
    var h = d.getHours();
    var m = d.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if(h === 0) h = 12;
    return h + ":" + (m < 10 ? "0" : "") + m + " " + ampm;
  }
  function fmtCountdown(ms){
    var neg = ms < 0;
    var abs = Math.abs(ms);
    var totalSec = Math.floor(abs / 1000);
    var mm = Math.floor(totalSec / 60);
    var ss = totalSec % 60;
    return (neg ? "-" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss;
  }

  function scheduledStart(i){
    if(!practice.running && practice.currentIndex === -1) return null;
    if(i < practice.currentIndex) return practice.actualStarts[i] || null;
    if(i === practice.currentIndex) return practice.currentBlockStart;
    var t = practice.currentBlockStart + practice.durations[practice.currentIndex] * 60000;
    for(var k = practice.currentIndex + 1; k < i; k++){
      t += practice.durations[k] * 60000;
    }
    return t;
  }

  function nowRef(){
    return practice.paused ? practice.pausedAt : Date.now();
  }

  function startPractice(){
    practice.running = true;
    practice.complete = false;
    practice.currentIndex = 0;
    practice.currentBlockStart = Date.now();
    practice.paused = false;
    practice.actualStarts = [Date.now()];
    practice.bellPlayedIndex = -1;
    startTicker();
    render();
  }

  function nextBlock(){
    if(practice.currentIndex < BLOCKS.length - 1){
      practice.currentIndex++;
      practice.currentBlockStart = Date.now();
      practice.actualStarts[practice.currentIndex] = Date.now();
      practice.paused = false;
    } else {
      practice.running = false;
      practice.complete = true;
      stopTicker();
    }
    render();
  }

  function addTime(min){
    practice.durations[practice.currentIndex] += min;
    render();
  }

  function togglePause(){
    if(practice.paused){
      var pausedDur = Date.now() - practice.pausedAt;
      practice.currentBlockStart += pausedDur;
      practice.paused = false;
    } else {
      practice.paused = true;
      practice.pausedAt = Date.now();
    }
    render();
  }

  function resetPractice(){
    practice = {
      running:false, complete:false, currentIndex:-1, currentBlockStart:null,
      paused:false, pausedAt:null,
      durations: BLOCKS.map(function(b){ return b.duration; }),
      actualStarts: [], bellPlayedIndex:-1
    };
    stopTicker();
    render();
  }

  function startTicker(){
    stopTicker();
    tickHandle = setInterval(function(){
      if(practice.running && !practice.paused){
        var remaining = practice.durations[practice.currentIndex] * 60000 - (Date.now() - practice.currentBlockStart);
        if(remaining <= 0 && practice.bellPlayedIndex !== practice.currentIndex){
          practice.bellPlayedIndex = practice.currentIndex;
          beep();
        }
      }
      render();
    }, 1000);
  }
  function stopTicker(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  function goHome(){ view = "home"; viewBlockIndex = null; render(); window.scrollTo(0,0); }
  function openBlockView(i){ view = "block"; viewBlockIndex = i; render(); window.scrollTo(0,0); }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }

  function renderTimerBar(){
    var idx = practice.currentIndex;
    var b = BLOCKS[idx];
    var remaining = practice.durations[idx] * 60000 - (nowRef() - practice.currentBlockStart);
    var isOver = remaining < 0;
    var nextLabel = idx < BLOCKS.length - 1 ? BLOCKS[idx+1].label : "Finish";
    var html = '<div class="timerbar">';
    html += '<div class="timerbar-top"><div><p class="timerbar-label">' + (practice.paused ? "PAUSED" : "NOW") + '</p><p class="timerbar-name">' + esc(b.label) + '</p></div>';
    html += '<div class="timerbar-clock' + (isOver ? " over" : "") + '">' + fmtCountdown(remaining) + '</div></div>';
    html += '<div class="timerbar-row">';
    html += '<button class="tb-btn" data-add="1">+1m</button>';
    html += '<button class="tb-btn" data-add="3">+3m</button>';
    html += '<button class="tb-btn" data-add="5">+5m</button>';
    html += '<button class="tb-btn pause" data-action="pause">' + (practice.paused ? "Resume" : "Pause") + '</button>';
    html += '<button class="tb-btn next" data-action="next">' + (idx === BLOCKS.length-1 ? "Finish" : "Next \u203a") + '</button>';
    html += '</div></div>';
    return html;
  }

  function render(){
    var html = "";

    html += '<div class="topbar"><h1>Practice 1</h1><p class="sub">Beech Springs Middle - Wed, Aug 6</p></div>';

    if(practice.running){
      html += renderTimerBar();
    }

    if(view === "home"){
      html += '<div class="content">';

      if(!practice.running && !practice.complete){
        html += '<button class="start-btn" data-action="start">Start practice</button>';
      }

      if(practice.complete){
        html += '<div class="complete-card"><h2>Practice complete</h2><p>Nice work out there. Reset when you\'re ready for next time.</p><button class="reset-btn" data-action="reset">Reset for next practice</button></div>';
      }

      BLOCKS.forEach(function(b, i){
        var isNow = practice.running && i === practice.currentIndex;
        var isDone = practice.currentIndex > i || (practice.complete && true);
        var cls = "block-card" + (isNow ? " now" : "") + (isDone && !isNow ? " done" : "");
        var timeLabel;
        if(practice.running || practice.complete){
          if(i < practice.currentIndex || practice.complete){
            timeLabel = practice.actualStarts[i] ? fmtClock(practice.actualStarts[i]) + " - done" : "done";
          } else if(isNow){
            timeLabel = "In progress";
          } else {
            timeLabel = "~" + fmtClock(scheduledStart(i)) + " (est.)";
          }
        } else {
          timeLabel = b.plannedTime + " - " + b.duration + " min";
        }
        html += '<button class="' + cls + '" data-open="' + i + '">';
        html += '<div class="block-num">' + (i+1) + '</div>';
        html += '<div class="block-info"><p class="block-label">' + esc(b.label) + '</p><p class="block-time">' + timeLabel + '</p></div>';
        html += '<span class="icon-chev">' + ICON_CHEV + '</span></button>';
      });
      html += '</div>';
    }

    if(view === "block" && viewBlockIndex != null){
      var b2 = BLOCKS[viewBlockIndex];
      html += '<div class="detail-topbar"><button class="icon-btn" data-nav="home">' + ICON_BACK + '</button>';
      html += '<div class="detail-titles"><p class="dname">' + esc(b2.label) + '</p><p class="dtime">' + esc(b2.plannedTime) + ' - ' + b2.duration + ' min</p></div></div>';
      html += '<div class="content">';
      html += '<div class="steps-card"><ul>';
      b2.steps.forEach(function(s){ html += '<li>' + esc(s) + '</li>'; });
      html += '</ul></div>';
      if(b2.diagram){
        html += '<p class="block-time" style="margin:0 0 6px 2px;font-weight:700;">Diagram' + (b2.diagram2 ? ' - Drill A' : '') + '</p>';
        html += '<div class="diagram-card">' + b2.diagram + '</div>';
      }
      if(b2.diagram2){
        html += '<p class="block-time" style="margin:14px 0 6px 2px;font-weight:700;">Diagram - Drill B</p>';
        html += '<div class="diagram-card">' + b2.diagram2 + '</div>';
      }
      if(b2.note){
        html += '<div class="note-card"><p class="note-label">Coaching note</p><p>' + esc(b2.note) + '</p></div>';
      }
      html += '</div>';
    }

    document.getElementById("app").innerHTML = ARROW_DEFS + html;
    attachHandlers();
  }

  function attachHandlers(){
    var app = document.getElementById("app");
    var startBtn = app.querySelector('[data-action="start"]');
    if(startBtn) startBtn.addEventListener("click", startPractice);
    var resetBtn = app.querySelector('[data-action="reset"]');
    if(resetBtn) resetBtn.addEventListener("click", resetPractice);
    var nextBtn = app.querySelector('[data-action="next"]');
    if(nextBtn) nextBtn.addEventListener("click", nextBlock);
    var pauseBtn = app.querySelector('[data-action="pause"]');
    if(pauseBtn) pauseBtn.addEventListener("click", togglePause);
    app.querySelectorAll('[data-add]').forEach(function(el){
      el.addEventListener("click", function(){ addTime(parseInt(el.getAttribute("data-add"), 10)); });
    });
    app.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener("click", function(){ openBlockView(parseInt(el.getAttribute("data-open"), 10)); });
    });
    var navHome = app.querySelector('[data-nav="home"]');
    if(navHome) navHome.addEventListener("click", goHome);
  }

  render();
})();
</script>
</body>
</html>
